allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    def setAndroidConfig = { p ->
        if (p.hasProperty("android")) {
            try {
                if (p.android.namespace == null) {
                    p.android.namespace = "com.legacy." + p.name.replaceAll("[^a-zA-Z0-9_]", "_")
                }
                p.android.compileSdkVersion 34
                p.android.compileOptions {
                    sourceCompatibility JavaVersion.VERSION_1_8
                    targetCompatibility JavaVersion.VERSION_1_8
                }
            } catch (e) {
                // Ignore if property does not exist
            }
        }
    }
    if (project.state.executed) {
        setAndroidConfig(project)
    } else {
        project.afterEvaluate { p -> setAndroidConfig(p) }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
