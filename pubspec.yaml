name: monastery_360
description: "Virtual Tours, Interactive Map, Dual Auth (Tourist/Local), Monk AI, Cultural Calendar & Archives."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & Utilities
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: any
  http: ^1.2.0
  shared_preferences: ^2.2.2

  # Firebase Services
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Maps & 360 Panoramas
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  panorama_viewer: ^2.0.7
  dchs_motion_sensors: ^2.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/panoramas/
